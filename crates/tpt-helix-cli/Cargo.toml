[package]
name = "tpt-helix-cli"
version = "0.1.0"
edition = "2024"
license.workspace = true
rust-version.workspace = true
description = "The `helix` developer CLI: run guests, render pages to PNG, migrate apps, build guests, scaffold projects, and check the toolchain."
readme = "README.md"
keywords = ["cli", "webassembly", "render", "migration", "helix"]
categories = ["command-line-utilities", "development-tools", "wasm"]

[[bin]]
name = "helix"
path = "src/main.rs"

[dependencies]
tpt-helix-runtime = { path = "../tpt-helix-runtime", version = "0.1.0" }
tpt-helix-migrate = { path = "../tpt-helix-migrate", version = "0.1.0" }
tpt-helix-wit = { path = "../tpt-helix-wit", version = "0.1.0" }
ed25519-dalek = "2"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
clap = { version = "4", features = ["derive"] }
