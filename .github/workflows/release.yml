name: Release

# Tag-triggered release: builds the `helix` CLI for Linux, macOS, and Windows
# and attaches the binaries to a GitHub release. Push a tag such as `v0.1.0`
# to run it. Also runnable by hand from the Actions tab (workflow_dispatch),
# which builds the artifacts without publishing a release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            exe: helix
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
            exe: helix
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            exe: helix.exe
    steps:
      - uses: actions/checkout@v7

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Put Git's `patch` on PATH (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "C:/Program Files/Git/usr/bin" >> "$GITHUB_PATH"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build helix CLI (release)
        run: cargo build --release -p tpt-helix-cli --target ${{ matrix.target }}

      - name: Package binary
        shell: bash
        run: |
          set -euo pipefail
          name="helix-${GITHUB_REF_NAME:-dev}-${{ matrix.target }}"
          mkdir -p dist/"$name"
          cp "target/${{ matrix.target }}/release/${{ matrix.exe }}" dist/"$name"/
          cp README.md LICENSE-MIT LICENSE-APACHE dist/"$name"/
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "$name.zip" "$name" >/dev/null
          else
            tar -czf "$name.tar.gz" "$name"
          fi
          sha256sum "$name".* > "$name.sha256" 2>/dev/null || shasum -a 256 "$name".* > "$name.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: helix-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  release:
    name: publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
